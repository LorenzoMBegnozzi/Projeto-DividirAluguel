<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Schibsted Grotesk (Google Fonts, OFL 1.1), variável 400 a 800, servida do projeto */
        @font-face { font-family: "Schibsted Grotesk"; font-weight: 400 800; font-display: block; src: url("assets/fonts/schibsted-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
        @font-face { font-family: "Schibsted Grotesk"; font-weight: 400 800; font-display: block; src: url("assets/fonts/schibsted-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        #card-root { position: absolute; inset: 0; overflow: hidden; background: #174c62; font-family: "Schibsted Grotesk", sans-serif; }
        #card-stage { position: absolute; inset: 0; }
        #card-glow {
          position: absolute; left: -200px; right: -200px; top: 120px; height: 1100px;
          background: radial-gradient(ellipse 50% 45% at 50% 50%, rgba(95, 179, 209, 0.22), rgba(95, 179, 209, 0) 70%);
        }
        #card-box {
          position: absolute; left: 90px; top: 340px; width: 850px;
          background: #ffffff; border-radius: 40px; padding: 48px 48px 52px;
          box-shadow: 0 40px 80px -30px rgba(10, 30, 40, 0.6);
        }
        #card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
        #card-who { display: flex; align-items: center; gap: 24px; min-width: 0; }
        #card-avatar { width: 104px; height: 104px; border-radius: 50%; background: #fbe3d9; color: #c04e2b; display: grid; place-items: center; font-size: 40px; font-weight: 800; flex: none; }
        #card-name { font-size: 46px; font-weight: 800; color: #1b2b33; letter-spacing: -0.02em; line-height: 1.1; }
        #card-occ { font-size: 30px; font-weight: 500; color: #5e6d75; margin-top: 6px; }
        #card-score { display: grid; gap: 10px; justify-items: end; text-align: right; }
        #card-num { font-size: 136px; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; color: #257a58; font-variant-numeric: tabular-nums; }
        #card-num small { font-size: 56px; font-weight: 800; letter-spacing: 0; }
        #card-bar { width: 220px; height: 12px; border-radius: 6px; background: #f1ece3; overflow: hidden; }
        #card-fill { width: 92%; height: 100%; border-radius: 6px; background: #257a58; transform-origin: 0 50%; }
        #card-lab { font-size: 26px; font-weight: 600; color: #5e6d75; }
        #card-line { height: 2px; background: #e3dccf; margin: 40px 0 34px; }
        #card-title { font-size: 42px; font-weight: 700; color: #1b2b33; letter-spacing: -0.015em; }
        #card-facts { display: flex; gap: 32px; margin-top: 12px; font-size: 32px; font-weight: 500; color: #46565e; }
        #card-facts strong { font-weight: 800; color: #1b2b33; }
        #card-chips { display: flex; flex-wrap: nowrap; gap: 14px; margin-top: 36px; }
        .card-chip {
          display: inline-flex; align-items: center; gap: 12px; height: 72px; padding: 0 26px 0 20px; border-radius: 999px;
          border: 3px solid #1e5f7a; background: #dcebf1; color: #174c62; font-size: 30px; font-weight: 700;
        }
        .card-chip i { width: 20px; height: 20px; border-radius: 50%; background: #1e5f7a; }
      </style>

      <div id="card-root" data-composition-id="card" data-width="1080" data-height="1920">
        <div id="card-stage">
          <div id="card-glow"></div>
          <div id="card-box">
            <div id="card-top">
              <div id="card-who">
                <div id="card-avatar">JU</div>
                <div><div id="card-name">Júlia, 21</div><div id="card-occ">Arquitetura na UEM</div></div>
              </div>
              <div id="card-score">
                <div id="card-num"><span id="card-val">0</span><small>%</small></div>
                <div id="card-bar"><div id="card-fill"></div></div>
                <div id="card-lab">compatível</div>
              </div>
            </div>
            <div id="card-line"></div>
            <div id="card-title">Quarto individual na Zona 7</div>
            <div id="card-facts"><span><strong>R$ 650</strong> por mês</span><span>8 min a pé da UEM</span></div>
            <div id="card-chips">
              <span class="card-chip" id="card-c1"><i></i>não fuma</span>
              <span class="card-chip" id="card-c2"><i></i>tem gato</span>
              <span class="card-chip" id="card-c3"><i></i>dorme cedo</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var T = window.RACHA_TIMES;
          var tl = gsap.timeline({ paused: true });
          // corte seco com leve escala
          tl.fromTo("#card-stage", { scale: 0.96 }, { scale: 1, duration: 0.35, ease: "power3.out" }, 0);
          tl.fromTo("#card-box", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.02);
          // selo: 0 a 92% com o mesmo ease-out cúbico do app (CompatScore.tsx)
          var v = { p: 0 }, val = document.getElementById("card-val"), fill = document.getElementById("card-fill");
          tl.fromTo(v, { p: 0 }, {
            p: 1, duration: T.countDur, ease: "none",
            onUpdate: function () { var e = 1 - Math.pow(1 - v.p, 3); val.textContent = Math.round(e * 92); fill.style.transform = "scaleX(" + e + ")"; }
          }, T.countStart - T.cardStart);
          ["#card-c1", "#card-c2", "#card-c3"].forEach(function (id, i) {
            tl.fromTo(id, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(2.2)" }, T.chips[i] - T.cardStart);
          });
          window.__timelines["card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
