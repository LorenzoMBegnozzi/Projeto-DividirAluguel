<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Schibsted Grotesk (Google Fonts, OFL 1.1), variável 400 a 800, servida do projeto */
        @font-face { font-family: "Schibsted Grotesk"; font-weight: 400 800; font-display: block; src: url("assets/fonts/schibsted-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
        @font-face { font-family: "Schibsted Grotesk"; font-weight: 400 800; font-display: block; src: url("assets/fonts/schibsted-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        #gratis-root {
          position: absolute; inset: 0; overflow: hidden; font-family: "Schibsted Grotesk", sans-serif;
          background: radial-gradient(ellipse 120% 45% at 50% 105%, #dcebf1 0%, rgba(220, 235, 241, 0.7) 35%, rgba(220, 235, 241, 0) 75%), #faf7f2;
        }
        #gratis-stage { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 140px 260px; }
        #gratis-h { font-size: 112px; font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; color: #1b2b33; }
        #gratis-h span, #gratis-p span { display: inline-block; }
        #gratis-p { margin-top: 44px; font-size: 64px; font-weight: 800; letter-spacing: -0.02em; color: #1b2b33; }
      </style>

      <div id="gratis-root" data-composition-id="gratis" data-width="1080" data-height="1920">
        <div id="gratis-stage">
          <div id="gratis-h"><span>Procurar</span> <span>vaga</span> <span>é</span> <span>grátis.</span></div>
          <div id="gratis-p"><span>Link</span> <span>na</span> <span>bio.</span></div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#gratis-stage", { scale: 0.96 }, { scale: 1, duration: 0.35, ease: "power3.out" }, 0);
          // palavra por palavra no ritmo de fala, em colcheias de 100 BPM (0,3 s)
          var words = document.querySelectorAll("#gratis-h span, #gratis-p span");
          var at = [0.1, 0.4, 0.7, 0.85, 1.8, 1.95, 2.1];
          words.forEach(function (w, i) {
            tl.fromTo(w, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, at[i]);
          });
          window.__timelines["gratis"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
