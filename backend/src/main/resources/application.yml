spring:
  application:
    name: rachaai
  config:
    # Rodando fora do Docker (IDE / mvnw), a variável AMBIENTE (dev, homolog ou prod) escolhe o
    # .env da raiz do projeto de onde vêm porta do banco, senhas e perfil. Sem AMBIENTE, usa dev.
    # No Docker o arquivo não existe (optional) e tudo vem das variáveis do docker-compose.
    import:
      - optional:file:../.env.${AMBIENTE:dev}[.properties]
      - optional:file:./.env.${AMBIENTE:dev}[.properties]
  profiles:
    # No Docker quem define é SPRING_PROFILES_ACTIVE; localmente, o APP_ENV do .env importado.
    active: ${APP_ENV:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/rachaai}
    username: ${DB_USER:rachaai}
    password: ${DB_PASSWORD:rachaai}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Endereço público do site, usado nos links enviados por e-mail.
  base-url: ${APP_BASE_URL:http://localhost:8081}
  mail:
    from: ${MAIL_FROM:Toc Toc Who? <nao-responda@rachaai.local>}
  # Limite de tentativas (ver RateLimiter). Estes são os valores de produção.
  rate-limit:
    login-erros-por-email: 5      # erros de senha por e-mail a cada 15 min
    login-por-ip: 20              # tentativas de login por IP a cada 5 min
    cadastro-por-ip: 5            # cadastros por IP por hora
    esqueci-senha-por-ip: 5       # pedidos de "esqueci a senha" por IP por hora
    esqueci-senha-por-email: 3    # ... e por e-mail por hora
    redefinir-senha-por-ip: 10    # tentativas de redefinir por IP por hora
  # Registros de acesso (Marco Civil, art. 15): por quantos dias guardar. A lei pede 6 meses.
  access-log:
    retention-days: ${ACCESS_LOG_RETENTION_DAYS:183}
  admin:
    # E-mails das contas administradoras, separados por vírgula (ver AdminBootstrap).
    emails: ${ADMIN_EMAILS:}
  billing:
    # SIMULADO: botão "Simular pagamento", ninguém é cobrado.
    # MERCADOPAGO: cobrança pelo Mercado Pago (Pix, crédito e débito). Ver docs/06-COBRANCA.md.
    # DESATIVADO: nenhuma compra pode ser feita.
    mode: ${BILLING_MODE:SIMULADO}
    free-listings: ${FREE_LISTINGS:3}
    # Preços de TESTE (R$ 1,00, o mínimo que o Mercado Pago aceita com folga). Definir os reais antes de lançar.
    extra-listing-price: ${EXTRA_LISTING_PRICE:1.00}
    extra-listing-days: ${EXTRA_LISTING_DAYS:30}
    highlight-price: ${HIGHLIGHT_PRICE:1.00}
    highlight-days: ${HIGHLIGHT_DAYS:30}
    expiration-check: ${EXPIRATION_CHECK:PT10M}
    mercadopago:
      access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
      webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
      # Endereço público do aviso automático (precisa de domínio com HTTPS). Vazio em dev.
      webhook-url: ${MERCADOPAGO_WEBHOOK_URL:}
      api-url: https://api.mercadopago.com

springdoc:
  swagger-ui:
    path: /swagger-ui.html
