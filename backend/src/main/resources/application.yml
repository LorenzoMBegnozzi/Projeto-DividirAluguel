spring:
  application:
    name: rachaai
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1522/XEPDB1}
    username: ${DB_USER:rachaai}
    password: ${DB_PASSWORD:rachaai}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  billing:
    # SIMULADO: o pagamento é confirmado por um botão de teste (não cobra ninguém).
    # Para cobrar de verdade, integrar um gateway (ver docs/06-COBRANCA.md).
    mode: ${BILLING_MODE:SIMULADO}
    free-listings: ${FREE_LISTINGS:3}
    extra-listing-price: ${EXTRA_LISTING_PRICE:19.90}
    extra-listing-days: ${EXTRA_LISTING_DAYS:30}
    highlight-price: ${HIGHLIGHT_PRICE:14.90}
    highlight-days: ${HIGHLIGHT_DAYS:30}
    expiration-check: ${EXPIRATION_CHECK:PT10M}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
