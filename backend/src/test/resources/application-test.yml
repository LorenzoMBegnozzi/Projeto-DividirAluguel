spring:
  datasource:
    url: jdbc:h2:mem:rachaai;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

# Tudo explícito aqui, para os testes não dependerem do .env da máquina (o application.yml
# importa o ../.env.<AMBIENTE> quando existe).
app:
  # H2 não tem políticas por linha (RLS). O RLS é testado no Postgres de verdade em
  # RlsPostgresTest (roda no "./mvnw test" normal, via Testcontainers).
  rls:
    enabled: false
  # H2 não tem a tabela registros_acesso (não é gerenciada pelo Hibernate).
  access-log:
    enabled: false
  jwt:
    secret: ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=
    expiration-minutes: 1440
  cors:
    allowed-origins: http://localhost:5173
  admin:
    emails: admin@teste.com
  # Contas @teste.com nascem confirmadas; os testes de confirmação usam outro domínio.
  email-confirmation:
    auto-confirm-domain: teste.com
  billing:
    mode: SIMULADO
  # Limites de produção (os testes usam um IP diferente por pessoa para não se esbarrarem).
  rate-limit:
    login-erros-por-email: 5
    login-por-ip: 20
    cadastro-por-ip: 5
    esqueci-senha-por-ip: 5
    esqueci-senha-por-email: 3
    redefinir-senha-por-ip: 10
    reenviar-confirmacao-por-conta: 3
