# Um só arquivo para os três ambientes (dev, homolog, prod). O que muda de um para o outro vem do
# arquivo .env.<ambiente>: portas, senhas, perfil do Spring e o nome do projeto do Compose
# (COMPOSE_PROJECT_NAME), que separa containers, rede e o volume do banco de cada ambiente.
#
# Não rode "docker compose up" direto: use scripts/ambiente.ps1 (PowerShell) ou
# scripts/ambiente.sh (Git Bash). Ver docs/07-AMBIENTES.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # POSTGRES_USER é sempre superusuário (o Postgres cria assim); por isso fica só para
      # bootstrap/administração. A aplicação conecta com APP_USER, um usuário comum — é o que
      # faz as políticas por linha (RLS, migration V2) realmente filtrarem: um superusuário
      # sempre ignora RLS, mesmo com FORCE ROW LEVEL SECURITY. Ver database/initdb/01-app-role.sh.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env do ambiente (senha do superusuário postgres)}
      APP_USER: ${DB_USER:-rachaai}
      APP_USER_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env do ambiente}
      APP_DB: ${DB_USER:-rachaai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:?defina DB_PORT no .env do ambiente}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_ENV:?defina APP_ENV (dev, homolog ou prod) no .env do ambiente}
      DB_URL: jdbc:postgresql://db:5432/${DB_USER:-rachaai}
      DB_USER: ${DB_USER:-rachaai}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env do ambiente (uma string em Base64)}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS no .env do ambiente}
      BILLING_MODE: ${BILLING_MODE:-SIMULADO}
      FREE_LISTINGS: ${FREE_LISTINGS:-2}
      EXTRA_LISTING_PRICE: ${EXTRA_LISTING_PRICE:-19.90}
      EXTRA_LISTING_DAYS: ${EXTRA_LISTING_DAYS:-30}
      HIGHLIGHT_PRICE: ${HIGHLIGHT_PRICE:-14.90}
      HIGHLIGHT_DAYS: ${HIGHLIGHT_DAYS:-30}
      EXPIRATION_CHECK: ${EXPIRATION_CHECK:-PT10M}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_WEBHOOK_URL: ${MERCADOPAGO_WEBHOOK_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:?defina APP_BASE_URL no .env do ambiente}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Toc Toc Who? <nao-responda@rachaai.local>}
    ports:
      - "${API_PORT:?defina API_PORT no .env do ambiente}:8080"

  # Caixa de e-mail de teste: captura os e-mails enviados (dev e homolog). Só sobe quando o .env do
  # ambiente tem COMPOSE_PROFILES=mail-teste; prod não liga esse perfil e usa um SMTP real.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    profiles: ["mail-teste"]
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"

  frontend:
    build:
      context: ./frontend
      args:
        # Mapas e busca de endereço (MapTiler). Vazia = OpenStreetMap gratuito.
        VITE_MAPTILER_KEY: ${MAPTILER_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${SITE_PORT:?defina SITE_PORT no .env do ambiente}:80"

volumes:
  # Cada ambiente tem o seu (o Compose prefixa com COMPOSE_PROJECT_NAME: rachaai-dev_postgres_data...).
  postgres_data:
