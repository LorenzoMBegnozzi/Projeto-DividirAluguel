services:
  db:
    image: gvenzl/oracle-xe:21-slim-faststart
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?defina ORACLE_PASSWORD no arquivo .env (senha do SYS/SYSTEM)}
      APP_USER: ${DB_USER:-rachaai}
      APP_USER_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    volumes:
      - oracle_data:/opt/oracle/oradata
    ports:
      - "1522:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@db:1521/XEPDB1
      DB_USER: ${DB_USER:-rachaai}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env (uma string em Base64)}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      BILLING_MODE: ${BILLING_MODE:-SIMULADO}
      FREE_LISTINGS: ${FREE_LISTINGS:-3}
      EXTRA_LISTING_PRICE: ${EXTRA_LISTING_PRICE:-19.90}
      EXTRA_LISTING_DAYS: ${EXTRA_LISTING_DAYS:-30}
      HIGHLIGHT_PRICE: ${HIGHLIGHT_PRICE:-14.90}
      HIGHLIGHT_DAYS: ${HIGHLIGHT_DAYS:-30}
      EXPIRATION_CHECK: ${EXPIRATION_CHECK:-PT10M}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-RachaAi <nao-responda@rachaai.local>}
    ports:
      - "8080:8080"

  # Servidor de e-mail de teste: captura os e-mails enviados (caixa de entrada em http://localhost:8025).
  # Em produção, troque as variáveis MAIL_* por um provedor real e remova este serviço.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  oracle_data:
