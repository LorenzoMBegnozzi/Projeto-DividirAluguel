# A cada push na main: roda os testes e, se passarem, gera as imagens Docker da API e do site e
# publica no GitHub Container Registry (ghcr.io). O servidor só baixa essas imagens
# (deploy/servidor.sh), sem compilar nada. Cada versão ganha duas etiquetas:
#   main          a mais nova (o homolog usa esta)
#   sha-<7 letras> uma versão fixa, para levar à produção depois de testada no homolog
#
# Segredo do repositório (Settings > Secrets and variables > Actions):
#   MAPTILER_KEY  chave do MapTiler (vai dentro do site; a mesma para homolog e produção)
name: Imagens Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes do backend
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B -q test
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tipagem e regras de design do frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          node scripts/check-design.mjs

  imagens:
    needs: testes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Nome e etiquetas da imagem
        id: img
        run: |
          echo "nome=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.nome }}:main
            ${{ steps.img.outputs.nome }}:${{ steps.img.outputs.sha }}
          build-args: |
            VITE_MAPTILER_KEY=${{ secrets.MAPTILER_KEY }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Versão gerada
        run: echo "::notice::${{ matrix.app }} publicado como ${{ steps.img.outputs.sha }}"
