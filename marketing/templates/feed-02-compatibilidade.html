<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8" />
<title>Feed 02 · Compatibilidade</title>
<link rel="stylesheet" href="_base.css" />
<script src="_kit.js"></script>
<style>
  .top { position: absolute; left: 80px; right: 80px; top: 72px; display: flex; align-items: center; justify-content: space-between; }
  h1 { position: absolute; left: 80px; right: 80px; top: 180px; font-size: 92px; }
  .card { position: absolute; left: 70px; right: 70px; top: 560px; padding: 44px; }
  .row { display: flex; gap: 36px; align-items: center; }
  .thumb { position: relative; width: 210px; height: 210px; flex: none; border-radius: 28px; background: var(--brand-tint); overflow: hidden; }
  .thumb model-viewer { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); }
  .info { flex: 1; min-width: 0; }
  .info h2 { font-size: 42px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .info .price { margin-top: 10px; font-size: 30px; color: var(--ink-2); font-weight: 600; }
  .who { margin-top: 18px; display: flex; align-items: center; gap: 14px; font-size: 26px; color: var(--ink-3); }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 26px; }
  .score { width: 190px; flex: none; text-align: right; }
  .score b { display: block; font-size: 96px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--leaf); }
  .score b small { font-size: 48px; }
  .bar { margin-top: 14px; height: 12px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 92%; border-radius: 6px; background: var(--leaf); }
  .score span { display: block; margin-top: 10px; font-size: 26px; color: var(--ink-3); }
  .chips { margin-top: 36px; padding-top: 32px; border-top: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 14px; }
  .note { position: absolute; right: 96px; top: 1122px; font-size: 22px; color: var(--ink-3); }
  .bottom { position: absolute; left: 80px; right: 80px; bottom: 72px; display: flex; align-items: center; justify-content: space-between; }
</style>
<body>
  <div class="frame">
    <div class="top">
      <div class="logo">Racha<span>Ai</span></div>
      <div class="badge">Compatibilidade</div>
    </div>
    <h1 class="headline">Antes de chamar, veja o quanto <span class="hl">vocês combinam.</span></h1>
    <div class="card">
      <div class="row">
        <div class="thumb" id="thumb"></div>
        <div class="info">
          <h2>Quarto em apê na Zona 7</h2>
          <div class="price">R$ 650/mês · 2 moradores</div>
          <div class="who"><div class="avatar">M</div>Marina, 21 · estudante</div>
        </div>
        <div class="score"><b>92<small>%</small></b><div class="bar"><i></i></div><span>compatível</span></div>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="note">Exemplo ilustrativo</div>
    <div class="bottom">
      <div class="pill">Crie seu perfil grátis</div>
      <div class="foot">link na bio</div>
    </div>
  </div>
<script>
  const CHIPS = ['Não fuma', 'Tem um gato', 'Rotina de dia', 'Silêncio à noite', 'Divide as compras']
  document.getElementById('chips').innerHTML = CHIPS.map((c) => `<span class="chip">${icon('check')}${c}</span>`).join('')
  window.SCENE = {
    width: 1080, height: 1350, duration: 0,
    async setup() {
      this.apt = await kit.model(document.getElementById('thumb'), '/frontend/public/landing/apartment.glb', { 'animation-name': 'split', 'field-of-view': '34deg' })
      kit.tint(this.apt, 'accent', '#237fa4')
      await kit.ready()
    },
    async render() {
      kit.pose(this.apt, { yaw: 25, pitch: 58, split: 0.3 })
      await kit.frames(4)
    },
  }
</script>
</body>
</html>
