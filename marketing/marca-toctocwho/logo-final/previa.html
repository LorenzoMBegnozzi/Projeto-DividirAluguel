<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&display=block">
<style>
body{margin:0;background:#efe9df;width:1200px;padding:30px;box-sizing:border-box;font-family:"Schibsted Grotesk",sans-serif;color:#1b2b33}
h2{font-size:15px;font-weight:700;margin:6px 0 12px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:26px}
.c{background:#faf7f2;border-radius:20px;padding:20px;display:flex;align-items:center;justify-content:center;gap:16px;min-height:190px;flex-wrap:wrap}
.c.e{background:#1b2b33}.s2{grid-column:span 2}
p{width:100%;margin:6px 0 0;text-align:center;font-size:12.5px;color:#46565e}.e p{color:#bdb8ae}
img.app{width:170px;filter:drop-shadow(0 12px 16px rgba(27,43,51,.18))}
</style></head><body>
<h2>3D: ícone do app, avatar e redes</h2>
<div class="g">
 <div class="c"><img class="app" src="3d/icone-app-azul.png"><p>azul</p></div>
 <div class="c"><img class="app" src="3d/icone-app-creme.png"><p>creme</p></div>
 <div class="c"><img class="app" src="3d/icone-app-escuro.png"><p>escuro</p></div>
</div>
<h2>Minimalista (vetor): site, favicon, documentos</h2>
<div class="g">
 <div class="c s2"><img src="assinatura.svg" height="110"></div>
 <div class="c"><img src="assinatura-empilhada.svg" width="190"></div>
 <div class="c e s2"><img src="assinatura-escuro.svg" height="110"></div>
 <div class="c"><img src="icone.svg" width="64"><img src="icone.svg" width="32"><img src="icone.svg" width="16"><img src="icone-mono.svg" width="64"><img src="icone-app.svg" width="64"><p>64, 32, 16 px, uma cor e app</p></div>
</div></body></html>
