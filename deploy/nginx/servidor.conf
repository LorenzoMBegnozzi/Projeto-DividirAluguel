# Nginx do site NO SERVIDOR (substitui frontend/nginx.conf via deploy/docker-compose.servidor.yml).
# Fica atrás do Caddy, que recebe a internet em HTTPS e repassa para cá pela rede interna do Docker.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4M;

    # IP real do visitante: o Caddy manda em X-Forwarded-For. Só confia nesse cabeçalho quando a
    # conexão vem da rede interna do Docker (o Caddy); este Nginx não tem porta aberta para fora.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # porta de origem do visitante (Marco Civil, IP compartilhado/CGNAT): vem do Caddy
        proxy_set_header X-Real-Port $http_x_real_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Arquivos com hash no nome (o Vite gera um nome novo a cada versão): cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # A página e o service worker do PWA sempre conferem se há versão nova.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
