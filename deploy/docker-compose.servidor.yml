# Ajustes para rodar num SERVIDOR (VPS Linux de 2 GB), aplicados por cima de docker-compose.yml e
# docker-compose.prod.yml. Não rode direto: use deploy/servidor.sh (ver deploy/README.md).
#
# O que muda em relação ao PC de desenvolvimento:
#   - as imagens vêm prontas do GitHub (ghcr.io), geradas pelo GitHub Actions: compilar Java numa
#     VPS de 2 GB é lento e come a memória dos sites no ar;
#   - nenhuma porta fica aberta: quem recebe a internet é o Caddy (deploy/caddy), que fala com o
#     site pela rede "toctocwho-web" e cuida do HTTPS;
#   - cada container tem um limite de memória, para produção e homologação caberem juntas
#     (orçamento em deploy/README.md).
services:
  db:
    mem_limit: 256m
    # Postgres configurado para pouca memória (o padrão supõe uma máquina só para ele).
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=160MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30

  backend:
    image: ${IMAGE_REPO:-ghcr.io/lorenzombegnozzi/projeto-dividiraluguel}-backend:${IMAGE_TAG:-main}
    mem_limit: 600m
    environment:
      # Java com teto de memória (sem isso ele reserva 1/4 da RAM da máquina e cresce até lá).
      JAVA_TOOL_OPTIONS: >-
        -Xms64m -Xmx320m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m
        -Xss512k -XX:+UseSerialGC

  frontend:
    image: ${IMAGE_REPO:-ghcr.io/lorenzombegnozzi/projeto-dividiraluguel}-frontend:${IMAGE_TAG:-main}
    mem_limit: 64m
    restart: always
    ports: !reset []
    volumes:
      # Nginx do servidor: atrás do Caddy (IP real do visitante, cache dos arquivos, cabeçalhos).
      - ./deploy/nginx/servidor.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
      web:
        # Nome que o Caddy usa para achar este site: rachaai-prod-site ou rachaai-homolog-site.
        aliases:
          - ${COMPOSE_PROJECT_NAME}-site

  # Caixa de e-mail de teste (só homolog): sem porta pública. Para ver os e-mails, abra um túnel
  # SSH do seu computador (deploy/README.md, "Ver os e-mails do homolog").
  mailpit:
    mem_limit: 64m
    ports: !override
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"

networks:
  # Criada uma vez por deploy/servidor.sh (docker network create toctocwho-web).
  web:
    name: toctocwho-web
    external: true
