<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- cor da barra do navegador = --color-paper de cada tema; o ThemeContext corrige quando o tema é escolhido à mão -->
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a2228" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Toc Toc Who?</title>
    <script>
      (function () {
        var stored = localStorage.getItem('rachaai_theme')
        var theme = stored === 'light' || stored === 'dark' ? stored : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
        if (stored === theme) {
          var c = theme === 'dark' ? '#1a2228' : '#faf7f2'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c) })
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
